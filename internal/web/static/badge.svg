<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 86" width="60" height="86">
  <!-- OpenBrain badge: an off-white tile with a halftone orb and its orbit. Original artwork. -->
  <defs>
    <pattern id="dots" width="2.6" height="2.6" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="0.95" fill="#000"/>
    </pattern>
    <radialGradient id="shade" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.35" stop-color="#3a3a3a"/>
      <stop offset="0.75" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <mask id="orb"><circle cx="30" cy="40" r="19" fill="url(#shade)"/></mask>
  </defs>
  <rect width="60" height="86" rx="3" fill="#f2f2f2"/>
  <rect width="60" height="86" fill="url(#dots)" mask="url(#orb)"/>
  <circle cx="30" cy="40" r="19" fill="none" stroke="#000" stroke-width="1.1"/>
  <ellipse cx="30" cy="40" rx="27" ry="7.5" fill="none" stroke="#000" stroke-width="0.9" transform="rotate(-20 30 40)"/>
  <circle cx="53.4" cy="31.6" r="1.8" fill="#000"/>
  <path d="M10 73h40M14 77h32" stroke="#000" stroke-width="0.9"/>
</svg>
